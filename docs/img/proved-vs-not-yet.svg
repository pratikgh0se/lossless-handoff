<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 342" width="920" height="342" role="img" aria-labelledby="t d">
<title id="t">Proved, seen not proved, and not yet</title><desc id="d">Proved on questions with a hint: plain loses facts 100, 80, 58 percent; Lossless Handoff 100 percent at 1, 3 and 10 compactions; 0 items: B wrong and plain right. Seen, not proved: the loss is largest for replaced decisions, exact strings, error codes and order; on one machine over 7 days 35 receipts, delivered 35 of 35, right agent 35 of 35. Not yet: 4 seeds, Sonnet, up to 10 compactions; own benchmark; no study of other work; 0.19.1 fix 2 seeds up to 3 compactions; no hint 93 percent at 3 and 95 at 10; live lossless check 23 of 34 with 11 failed, cause not investigated.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:600}.bg{fill:#ffffff}.panel{fill:#f4f7f8;stroke:#d3dde1;stroke-width:1.5}
.t{fill:#14232b;font:600 14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.h{fill:#14232b;font:700 20px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.m{fill:#4d636c;font:13px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.num{fill:#14232b;font:700 13px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.a{fill:#c0392b}.as{fill:#fbe6e2}.b{fill:#0b7a75}.bs{fill:#d8f0ee}
.ok{fill:#26713a}.oks{fill:#dff1e4}.w{fill:#9a5700}.ws{fill:#fbefd2}
.sa{stroke:#c0392b}.sb{stroke:#0b7a75}.grid{stroke:#d3dde1;stroke-width:1;fill:none}
.ln{stroke:#4d636c;stroke-width:2;fill:none}.lw{fill:#ffffff}
.wa{fill:#ffffff;font:700 13px system-ui,Arial,sans-serif}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1a1f}.panel{fill:#162830;stroke:#2b4149}
.t,.h,.num{fill:#e5eef1}.m{fill:#9db2ba}
.a{fill:#ff8c78}.as{fill:#3b2420}.b{fill:#41cbc3}.bs{fill:#103230}
.ok{fill:#72d28c}.oks{fill:#173321}.w{fill:#f2b955}.ws{fill:#3a2d12}
.sa{stroke:#ff8c78}.sb{stroke:#41cbc3}.grid{stroke:#2b4149}.ln{stroke:#9db2ba}.lw{fill:#0e1a1f}
.wa{fill:#0e1a1f}}
</style>
<rect class="bg" x="0" y="0" width="920" height="342"/>
<text class="h" x="20" y="32" text-anchor="start">What the benchmarks show and what they do not</text><rect class="oks" x="20" y="52" width="290" height="270" rx="12"/><text class="ok" x="36" y="82" text-anchor="start">Proved (on questions with a hint)</text><text class="m" x="36" y="112" text-anchor="start">Plain loses facts as compactions add up:</text><text class="m" x="36" y="136" text-anchor="start">100%, 80%, 58% at 1, 3, 10.</text><text class="m" x="36" y="160" text-anchor="start">Lossless Handoff stopped that loss</text><text class="m" x="36" y="184" text-anchor="start">up to 10 compactions: 100%, 100%, 100%.</text><text class="m" x="36" y="208" text-anchor="start">0 items: B wrong and plain right.</text><rect class="panel" x="325" y="52" width="290" height="270" rx="12"/><text class="t" x="341" y="82" text-anchor="start">Seen, not proved</text><text class="m" x="341" y="112" text-anchor="start">Loss is largest for replaced decisions,</text><text class="m" x="341" y="136" text-anchor="start">exact strings, error codes and order</text><text class="m" x="341" y="160" text-anchor="start">(table made after the run).</text><text class="m" x="341" y="184" text-anchor="start">Mechanism runs on one machine, 7 days:</text><text class="m" x="341" y="208" text-anchor="start">35 receipts, delivered 35/35,</text><text class="m" x="341" y="232" text-anchor="start">right agent 35/35.</text><rect class="ws" x="630" y="52" width="290" height="270" rx="12"/><text class="w" x="646" y="82" text-anchor="start">Not yet</text><text class="m" x="646" y="112" text-anchor="start">4 seeds, Sonnet, up to 10 compactions.</text><text class="m" x="646" y="136" text-anchor="start">Our own benchmark, no outside one.</text><text class="m" x="646" y="160" text-anchor="start">No study of other people's work.</text><text class="m" x="646" y="184" text-anchor="start">0.19.1 fix: 2 seeds, max 3 compactions.</text><text class="m" x="646" y="208" text-anchor="start">No hint: 93% at 3, 95% at 10.</text><text class="m" x="646" y="232" text-anchor="start">Live lossless check: 23/34, 11 failed,</text><text class="m" x="646" y="256" text-anchor="start">cause not investigated.</text>
</svg>

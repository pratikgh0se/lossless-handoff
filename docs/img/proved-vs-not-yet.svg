<text class="h" x="20" y="32" text-anchor="start">What the benchmarks show and what they do not</text><rect class="oks" x="20" y="52" width="430" height="300" rx="12"/><rect class="ws" x="470" y="52" width="430" height="300" rx="12"/><text class="ok" x="40" y="84" text-anchor="start">Shown on our benchmark</text><text class="w" x="490" y="84" text-anchor="start">Not shown yet</text><text class="t" x="40" y="116" text-anchor="start">Plain loses facts: 100, 80, 58%</text><text class="t" x="40" y="142" text-anchor="start">Lossless Handoff: 100% at 1, 3, 10</text><text class="t" x="40" y="168" text-anchor="start">0 items where it did worse</text><text class="t" x="40" y="194" text-anchor="start">Loss is in replaced decisions,</text><text class="t" x="40" y="220" text-anchor="start">exact strings, error codes, order</text><text class="t" x="40" y="246" text-anchor="start">Live, 7 days: handoff 35/35,</text><text class="t" x="40" y="272" text-anchor="start">right agent 35/35</text><text class="t" x="490" y="116" text-anchor="start">4 seeds, Sonnet, up to 10 compactions</text><text class="t" x="490" y="142" text-anchor="start">Our own benchmark, no outside one</text><text class="t" x="490" y="168" text-anchor="start">No study of other people's work</text><text class="t" x="490" y="194" text-anchor="start">0.19.1 fix: 2 seeds, up to 3 compactions</text><text class="t" x="490" y="220" text-anchor="start">Live lossless check: 23/34, 11 failed</text><text class="t" x="490" y="246" text-anchor="start">(cause not investigated)</text>

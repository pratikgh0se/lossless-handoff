<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" role="img" aria-labelledby="t d">
<title id="t">Accuracy against compactions</title><desc id="d">Plain Claude Code: 100 percent at 1 compaction, 80 at 3, 58 at 10. Lossless Handoff: 100, 100, 100. 2 and 5 compactions were not measured. 4 seeds.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:600}.bg{fill:#ffffff}.panel{fill:#f4f7f8;stroke:#d3dde1;stroke-width:1.5}
.t{fill:#14232b;font:600 14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.h{fill:#14232b;font:700 20px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.m{fill:#4d636c;font:13px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.num{fill:#14232b;font:700 13px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.a{fill:#c0392b}.as{fill:#fbe6e2}.b{fill:#0b7a75}.bs{fill:#d8f0ee}
.ok{fill:#26713a}.oks{fill:#dff1e4}.w{fill:#9a5700}.ws{fill:#fbefd2}
.sa{stroke:#c0392b}.sb{stroke:#0b7a75}.grid{stroke:#d3dde1;stroke-width:1;fill:none}
.ln{stroke:#4d636c;stroke-width:2;fill:none}.lw{fill:#ffffff}
.wa{fill:#ffffff;font:700 13px system-ui,Arial,sans-serif}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1a1f}.panel{fill:#162830;stroke:#2b4149}
.t,.h,.num{fill:#e5eef1}.m{fill:#9db2ba}
.a{fill:#ff8c78}.as{fill:#3b2420}.b{fill:#41cbc3}.bs{fill:#103230}
.ok{fill:#72d28c}.oks{fill:#173321}.w{fill:#f2b955}.ws{fill:#3a2d12}
.sa{stroke:#ff8c78}.sb{stroke:#41cbc3}.grid{stroke:#2b4149}.ln{stroke:#9db2ba}.lw{fill:#0e1a1f}
.wa{fill:#0e1a1f}}
</style>
<rect class="bg" x="0" y="0" width="920" height="390"/>
<text class="h" x="20" y="32" text-anchor="start">Accuracy after 1, 3 and 10 compactions</text><path class="grid" d="M90 330.0 H640"/><text class="m" x="80" y="334.0" text-anchor="end">0%</text><path class="grid" d="M90 262.5 H640"/><text class="m" x="80" y="266.5" text-anchor="end">25%</text><path class="grid" d="M90 195.0 H640"/><text class="m" x="80" y="199.0" text-anchor="end">50%</text><path class="grid" d="M90 127.5 H640"/><text class="m" x="80" y="131.5" text-anchor="end">75%</text><path class="grid" d="M90 60.0 H640"/><text class="m" x="80" y="64.0" text-anchor="end">100%</text><path class="grid" style="stroke-dasharray:4 4" d="M196.0 60 V330"/><text class="m" x="196.0" y="348" text-anchor="middle">2</text><text class="w" x="196.0" y="322" text-anchor="middle">not measured</text><path class="grid" style="stroke-dasharray:4 4" d="M355.0 60 V330"/><text class="m" x="355.0" y="348" text-anchor="middle">5</text><text class="w" x="355.0" y="322" text-anchor="middle">not measured</text><text class="t" x="143.0" y="348" text-anchor="middle">1</text><text class="t" x="249.0" y="348" text-anchor="middle">3</text><text class="t" x="620.0" y="348" text-anchor="middle">10</text><text class="m" x="365.0" y="370" text-anchor="middle">compactions (x axis to scale)</text><polyline class="sa" style="fill:none;stroke-width:3.5" points="143.0,60.0 249.0,114.0 620.0,173.4"/><polyline class="sb" style="fill:none;stroke-width:3.5;stroke-dasharray:0" points="143.0,60.0 249.0,60.0 620.0,60.0"/><circle class="a" cx="143.0" cy="60.0" r="6"/><text class="num" x="143.0" y="84.0" text-anchor="middle">100%</text><circle class="a" cx="249.0" cy="114.0" r="6"/><text class="num" x="259.0" y="138.0" text-anchor="start">80%</text><circle class="a" cx="620.0" cy="173.4" r="6"/><text class="num" x="630.0" y="197.4" text-anchor="start">58%</text><circle class="b" cx="143.0" cy="60.0" r="6"/><circle class="b" cx="249.0" cy="60.0" r="6"/><circle class="b" cx="620.0" cy="60.0" r="6"/><text class="num" x="610.0" y="46.0" text-anchor="end">100%</text><rect class="a" x="670" y="120" width="16" height="16" rx="3"/><text class="t" x="694" y="133" text-anchor="start">Plain Claude Code</text><rect class="b" x="670" y="150" width="16" height="16" rx="3"/><text class="t" x="694" y="163" text-anchor="start">Lossless Handoff</text><text class="num" x="670" y="200" text-anchor="start">Gain at 10: +42 points</text><text class="m" x="670" y="220" text-anchor="start">95% interval +27 to +51</text><text class="m" x="670" y="240" text-anchor="start">4 seeds, Sonnet, 400k window</text><text class="w" x="670" y="262" text-anchor="start">Baseline blocked from transcripts;</text><text class="w" x="670" y="280" text-anchor="start">fair re-test: 82% vs 100%.</text>
</svg>

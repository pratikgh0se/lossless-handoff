name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax check shell scripts
        run: |
          for f in install.sh uninstall.sh tests/smoke.sh; do
            bash -n "$f"
          done

      - name: Install shellcheck if missing
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install shellcheck
            else
              sudo apt-get update && sudo apt-get install -y shellcheck
            fi
          fi
          shellcheck --version

      - name: Shellcheck
        run: shellcheck --severity=warning install.sh uninstall.sh tests/smoke.sh

      - name: Compile Python hooks
        run: python3 -m py_compile hooks/*.py

      - name: Smoke test
        run: bash tests/smoke.sh

  acceptance:
    # Code-blind acceptance tests from pratikgh0se/lossless-handoff-tests, pinned by tests.ref.
    # Builders read only the test names and assertion output below, never the test code.
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      LOSSLESS_HANDOFF_NO_LAUNCHCTL: "1"
      RECALL_EMBED_URL: "http://127.0.0.1:9"
    steps:
      - uses: actions/checkout@v4

      - name: Read tests.ref
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < tests.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: pratikgh0se/lossless-handoff-tests
          ref: ${{ steps.ref.outputs.sha }}
          path: .acceptance

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run acceptance tests
        run: |
          HANDOFF_HOOKS_DIR="$GITHUB_WORKSPACE/hooks" LOSSLESS_HANDOFF_REPO="$GITHUB_WORKSPACE" \
            python3 -W ignore -m unittest discover -s .acceptance
